# Ekko agent LLM. LLM_PROVIDER picks which credential set below is used:
#   ollama      -> OLLAMA_* here + OLLAMA_API_KEY in .env      (production)
#   openrouter  -> OPENROUTER_* here + OPENROUTER_API_KEY in .env
# Switch to openrouter only to exercise the agent while the Ollama token is
# out; switch back afterwards. The model must support tool calling either way.
LLM_PROVIDER: "ollama"

OLLAMA_BASE_URL: "https://ollama.com/v1"
OLLAMA_MODEL: "gemma4:31b"

OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
OPENROUTER_MODEL: "google/gemini-2.5-flash"

EXA_BASE_URL: "https://api.exa.ai"
EXA_SEARCH_TYPE: "auto"

# Native music browser. The checked-in version/key compatibility defaults are
# not an availability guarantee: Zing can rotate signatures at any time. Put
# key/secret overrides and optional account cookies only in .env; anonymous
# requests bootstrap Zing's short-lived session cookie automatically.
ZING_BASE_URL: "https://zingmp3.vn"
ZING_API_VERSION: "1.19.3"
JETSON_MUSIC_PLAYER: "mpv"

MINIO_ENDPOINT: "https://s3.phuongdong.cloud"
MINIO_BUCKET: "jetsona-assets"
MINIO_REGION: "us-east-1"
ASSETS_S3_PREFIX: ""
ASSETS_VERBOSE: "1"
ASSETS_FETCH_CLOUD_FONTS: "0"
JETSON_S3_ASSET_HELPER: ""

# Weather briefing for the morning alarm. Pinned to Da Nang so the alarm always
# reports local conditions instead of geo-detecting from the public IP.
JETSON_WEATHER_LAT: "16.0544"
JETSON_WEATHER_LON: "108.2022"
JETSON_WEATHER_NAME: "Đà Nẵng"

# Wake-on-LAN to the home PC. The agent fires this from the Jetson itself (the
# Jetson is the magic-packet firer), so the default endpoint is the local /wake
# route exposed by jetson-fw on this same box. Point it at the jetsona-ui cloud
# endpoint instead only if you want the request to round-trip through the
# browser app first. JETSON_WOL_TOKEN (the matching X-WoL-Token) lives in .env.
JETSON_WOL_URL: "http://127.0.0.1:8080/api/wol/wake"

# Voice loop (reSpeaker USB v3 + sherpa-onnx). ALSA pcm names for the mic and
# speaker. Pin the microphone by ALSA card name so it does not silently switch
# to the Jetson onboard codec when card indexes or the system default change
# (aplay/arecord -l lists the card).
# Model files live under assets/models/{kws,stt,tts}/, fetched by
# scripts/fetch_models.sh. Fine-tune model paths, providers (cpu/cuda) and
# thresholds via the Settings("voice",...) KV store at runtime.
JETSON_VOICE_MIC: "plughw:CARD=Lite,DEV=0"
# Pin playback to the ReSpeaker Lite as well. "default" resolves to PulseAudio
# on the Tegra APE card, and measurement showed nothing on that path reaches the
# room: four "Hey Nova" clips played through tegrasndt210ref left the wake model
# at its 0.002 noise floor, while the same clip through the Lite peaked at 0.861.
# The speaker is wired to the Lite, so its own replies must go there too.
#
# dmix rather than plughw: plughw grabs the card exclusively, so a reply spoken
# while JETSON_MUSIC_PLAYER still holds the device fails outright with
# "Device or resource busy" and the user simply hears nothing. dmix lets both
# streams share it. The inner quotes are required -- ALSA parses plug:'s
# arguments itself and rejects a bare plug:dmix:CARD=... -- and the config
# loader passes a double-quoted value through with its inner quotes intact.
# The plug: wrapper converts mono TTS up to the card's stereo 48 kHz.
JETSON_VOICE_OUT: "plug:'dmix:CARD=Lite,DEV=0'"

# Voice pipeline:
#   XU316 DSP PCM -> openWakeWord (continuous, 80 ms frames) -> Silero confirms
#   -> capture until silence -> OpenAI STT -> existing LLM -> Edge TTS.
# openWakeWord runs in a network-disabled sidecar and cannot exfiltrate raw
# microphone audio. Speex is intentionally disabled by default because the
# ReSpeaker XU316 has already applied AEC/NS/IC/VNR/AGC.
# Set from this device owner's own voice, not from synthetic speech. Logged
# attempts scored 0.128, 0.164, 0.209, 0.583, 0.719, 0.770, 0.851 -- a real
# "Hey Nova" lands anywhere in that range depending on how it is said, and the
# rejected attempts were no quieter than the accepted ones (loudest-frame RMS
# ~10500 either way), so level is not the variable. An earlier 0.45, chosen
# from a 0.86-scoring TTS clip, therefore threw away roughly half of them.
#
# The floor is far below all of it: ~30 minutes of room ambience with the fan
# running peaked at 0.006. 0.10 accepts every attempt above while still sitting
# more than an order of magnitude over the noise. Raise it only if real false
# wakes appear in the journal, and lower it only with new measured scores.
OPENWAKEWORD_SOCKET: "/run/jetsona-voice/openwakeword.sock"
OPENWAKEWORD_THRESHOLD: "0.10"
OPENWAKEWORD_MIN_FRAMES: "2"
OPENWAKEWORD_SPEEX: "0"

# Realtime voice. One streaming Gemini Live session replaces the four serial
# stages below (transcribe, think, think again, synthesise), which is what made
# the device impossible to interrupt: the microphone had to be muted while it
# spoke. Measured on this box: 3.4 s from the end of a question to the first
# word of the answer, against roughly fourteen.
#
# The session is opened by the local wake word and closed after
# GEMINI_LIVE_IDLE_SEC of quiet, so it is billed per conversation, not per day.
# Set JETSON_VOICE_REALTIME to 0 to fall back to the OPENAI_TRANSCRIBE_* and
# EDGE_TTS_* chain, which is kept working for exactly that reason.
# GEMINI_API_KEY lives in .env.
JETSON_VOICE_REALTIME: "1"
GEMINI_LIVE_SOCKET: "/run/jetsona-live/realtime.sock"
GEMINI_LIVE_MODEL: "gemini-2.5-flash-native-audio-preview-12-2025"
GEMINI_LIVE_VOICE: "Aoede"
GEMINI_LIVE_IDLE_SEC: "20"

# Daily ceiling on realtime session time. This path is billed by the second a
# session stays open, so a session that fails to close, or a run of false wakes,
# would spend for as long as nobody looks. The running total is kept in
# /var/lib/jetson-fw/realtime_usage.json so a restart cannot clear the day, and
# is printed with every session so the figure is in the journal rather than only
# on a bill.
#
# Hitting the ceiling is not an outage: the device falls back to the
# OPENAI_TRANSCRIBE_*/EDGE_TTS_* chain, which costs about a thousandth as much
# per turn, and returns to realtime at midnight. Set to 0 to remove the cap.
GEMINI_LIVE_DAILY_MINUTES: "60"

# Echo handling for a board whose canceller does nothing: measured here, the
# microphone hears the speaker at ~1.2x the level it was played at. Playback is
# attenuated so a person can be heard over it at all, and the microphone is only
# forwarded while Nova speaks once it beats the expected echo by the margin.
# These describe this room and this enclosure, so tune them by ear:
# quieter Nova -> lower the gain; Nova answering herself -> lower it further;
# interruptions not registering -> lower the margin.
JETSON_VOICE_OUT_GAIN: "0.35"
JETSON_ECHO_COUPLING: "1.2"
JETSON_ECHO_MARGIN: "2.2"

OPENAI_TRANSCRIBE_BASE_URL: "https://api.openai.com/v1"
OPENAI_TRANSCRIBE_MODEL: "gpt-4o-mini-transcribe"
OPENAI_TRANSCRIBE_LANGUAGE: "vi"

EDGE_TTS_SCRIPT: "/opt/jetson-fw/scripts/edge_tts_synthesize.sh"
EDGE_TTS_VOICE: "vi-VN-HoaiMyNeural"
EDGE_TTS_RATE: "+0%"
EDGE_TTS_SAMPLE_RATE: "24000"
JETSON_VOICE_RUNTIME_IMAGE: "jetsona/voice-runtime:oww0.6-edge7.2.8-genai2.14"

# Network and local paths.
JETSON_FILES_HOME: ""
# Absolute path pins the settings store to one file. Left empty it falls back to
# $HOME/.jetson-fw/settings.kv, and $HOME differs per launch path (systemd sets
# /root, `sudo run_headless.sh` keeps /home/<user>), so boot and manual runs
# would each read their own store. Pin it.
JETSON_SETTINGS_FILE: "/var/lib/jetson-fw/settings.kv"

# Build behavior.
JETSON_BUILD_DIR: ""
BUILD_JOBS: "4"
JETSON_SKIP_ASSET_FETCH: "0"

# INA219 UPS/power monitor.
INA219_BUS: "/dev/i2c-1"
INA219_ADDR: "0x42"
INA219_VMIN: "6.0"
INA219_VMAX: "8.4"
INA219_SHUNT: "0.1"
# Which current sign means "charging" on this module's shunt wiring. If the
# charging bolt stays dark on the charger (or shows on battery), flip to "-1".
# The firmware logs the measured mA once per start under the "ina219" tag:
#   journalctl -u jetson-fw | grep ina219
INA219_CHARGE_SIGN: "1"
INA219_CHARGE_MA: "50"
